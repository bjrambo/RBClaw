name: Runner smoke (manual)

# Never route pull-request CI to these persistent self-hosted machines.
# Public-repository approval policy remains a separate security requirement.
on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: >-
      github.repository == 'bjrambo/RBClaw' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'bjrambo' &&
      github.triggering_actor == 'bjrambo' &&
      github.ref == 'refs/heads/main'
    runs-on: rbclaw-runner-server-wsl-ij21s2i
    timeout-minutes: 3
    steps:
      - name: Verify isolated Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = runner-server-wsl
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -un)" = rbclaw-runner
          case "$PWD" in
            /home/rbclaw-runner/actions-runner/_work_linux/*) ;;
            *) printf 'Unexpected runner work directory\n' >&2; exit 1 ;;
          esac
          printf 'Runner: %s | OS: %s | Architecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          hostname
          id
          uname -r
          printf 'RBCLAW_RUNNER_SMOKE_OK\n'

  smoke-windows:
    if: >-
      github.repository == 'bjrambo/RBClaw' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'bjrambo' &&
      github.triggering_actor == 'bjrambo' &&
      github.ref == 'refs/heads/main'
    runs-on: rbclaw-runner-server-win-ij21s2i
    timeout-minutes: 3
    steps:
      - name: Verify isolated interactive Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'runner-server-win') { throw 'Unexpected runner name' }
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Unexpected runner OS' }
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Unexpected runner architecture' }
          if ($env:COMPUTERNAME -ne 'DESKTOP-IJ21S2I') { throw 'Unexpected runner host' }
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          if ($identity -ine "$env:COMPUTERNAME\qw5414") { throw 'Unexpected runner account' }
          $workRoot = 'C:\rbclaw-runners\windows\_work_windows\'
          if (-not $PWD.ProviderPath.StartsWith($workRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Unexpected runner work directory'
          }
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) { throw 'Windows runner requires an interactive user session' }
          Write-Output "Runner: $env:RUNNER_NAME | OS: $env:RUNNER_OS | Architecture: $env:RUNNER_ARCH"
          Write-Output "Host: $env:COMPUTERNAME | Account: $identity | Session: $sessionId"
          Write-Output 'RBCLAW_WINDOWS_RUNNER_SMOKE_OK'
